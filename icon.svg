<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- BECO Generadores — ícono oficial -->
  <!-- Fondo navy -->
  <rect width="192" height="192" rx="42" fill="#1F3864"/>
  <!-- Aro exterior sutil -->
  <circle cx="96" cy="92" r="60" fill="none" stroke="#2A4F82" stroke-width="1.5"/>
  <!-- Círculo generador IEEE -->
  <circle cx="96" cy="92" r="52" fill="none" stroke="#85B7EB" stroke-width="4"/>
  <!-- G centrada -->
  <text x="96" y="110" text-anchor="middle"
        font-size="52" font-weight="700" fill="#85B7EB"
        font-family="Arial,sans-serif" letter-spacing="-1">G</text>
  <!-- Terminal izquierda -->
  <line x1="44" y1="92" x2="20" y2="92" stroke="#85B7EB" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="92" r="4" fill="#85B7EB"/>
  <!-- Terminal derecha -->
  <line x1="148" y1="92" x2="172" y2="92" stroke="#85B7EB" stroke-width="4" stroke-linecap="round"/>
  <circle cx="172" cy="92" r="4" fill="#85B7EB"/>
  <!-- Campo magnético superior -->
  <path d="M56 60 Q96 34 136 60"
        fill="none" stroke="#4A7AB5" stroke-width="2.5"
        stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Campo magnético inferior -->
  <path d="M56 124 Q96 150 136 124"
        fill="none" stroke="#4A7AB5" stroke-width="2.5"
        stroke-dasharray="5,4" stroke-linecap="round"/>
  <!-- Rayo eléctrico -->
  <polygon points="130,14 114,46 130,46 111,80 150,48 132,48 146,14" fill="#85B7EB"/>
  <polygon points="130,19 117,46 130,46 114,74 144,49 129,49 141,19" fill="#2E5E9E"/>
  <!-- Línea separadora -->
  <line x1="36" y1="162" x2="156" y2="162" stroke="#2E5E9E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- BECO.SA -->
  <text x="96" y="180" text-anchor="middle"
        font-size="18" font-weight="700" fill="#85B7EB"
        font-family="Arial,sans-serif" letter-spacing="4">BECO.SA</text>
</svg>
