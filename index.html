<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pruebas Eléctricas — Bijao Electric</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BECO Gen">

<!-- MSAL v3 -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1F3864;--navy2:#2E5E9E;--navy-light:#D5E8F0;
  --bg:#F4F3F0;--surface:#FFFFFF;--surface2:#F8F8F6;
  --text:#0B0B0B;--text2:#52514E;--text3:#898781;
  --border:#E1E0D9;--border2:#C3C2B7;
  --danger-bg:#FCEBEB;--danger-text:#791F1F;--danger-border:#F09595;
  --warn-bg:#FAEEDA;--warn-text:#633806;--warn-border:#EF9F27;
  --ok-bg:#EAF3DE;--ok-text:#27500A;--ok-border:#97C459;
  --accent-bg:#E6F1FB;--accent-text:#0C447C;
  --u1:#1F3864;--u2:#1baf7a;--u3:#C55A11;
  --radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}

/* ── Corporate header ── */
.corp-header{background:var(--navy);padding:0}
.corp-header-inner{display:flex;align-items:stretch;justify-content:space-between;max-width:1280px;margin:0 auto;padding:0 1.5rem}
.corp-brand{display:flex;align-items:center;gap:12px;padding:1rem 0}
.corp-logo-mark{width:38px;height:38px;background:var(--surface);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--navy);letter-spacing:-.5px;flex-shrink:0}
.corp-logo-text{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.corp-logo-sub{color:#85B7EB;font-size:11px;margin-top:1px}
.corp-meta{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px}
.corp-meta-label{color:#85B7EB;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.corp-meta-value{color:#fff;font-size:13px;font-weight:500}
.auth-status{display:flex;align-items:center;gap:8px;padding:.5rem 0}
.auth-btn{padding:6px 14px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.auth-btn:hover{background:rgba(255,255,255,.2)}
.auth-btn.sign-out{border-color:rgba(255,255,255,.2);background:transparent;color:#85B7EB}
.auth-user{color:#85B7EB;font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Nav bar ── */
.nav-bar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-bar-inner{max-width:1280px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-tabs{display:flex;gap:0}
.nav-tab{padding:14px 18px;font-size:13px;color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;font-family:inherit;white-space:nowrap}
.nav-tab:hover{color:var(--navy)}
.nav-tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.nav-actions{display:flex;align-items:center;gap:8px}
.btn-nueva{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);border:none;background:var(--navy);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;font-family:inherit}
.btn-nueva:hover{background:var(--navy2)}
.btn-nueva:disabled{opacity:.5;cursor:not-allowed}
.btn-refresh{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text3);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-refresh:hover{border-color:var(--navy2);color:var(--navy2)}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#97C459}
.conn-dot.error{background:#F09595}
.conn-dot.loading{background:#EF9F27;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Content ── */
.content{max-width:1280px;margin:0 auto;padding:1.5rem}

/* ── Auth wall ── */
.auth-wall{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:20px;text-align:center}
.auth-wall-logo{width:72px;height:72px;background:var(--navy);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;margin:0 auto}
.auth-wall h2{font-size:18px;color:var(--text);font-weight:600}
.auth-wall p{font-size:13px;color:var(--text3);max-width:360px}
.btn-ms-login{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:var(--radius);border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-ms-login:hover{background:var(--navy2)}
.ms-logo{width:20px;height:20px;flex-shrink:0}

/* ── Section title ── */
.sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.875rem;padding-bottom:6px;border-bottom:2px solid var(--navy-light)}
.sec-title span{color:var(--navy)}

/* ── Loading ── */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--navy2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Badges ── */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-danger{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-border)}
.badge-warn{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border)}
.badge-ok{background:var(--ok-bg);color:var(--ok-text);border:1px solid var(--ok-border)}
.badge-accent{background:var(--accent-bg);color:var(--accent-text)}
.badge-post{background:#F3E8FB;color:#5B1F8A;border:1px solid #C89FE0}

/* ── Status cards (Resumen) ── */
.gen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:1.5rem}
.gen-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.gen-card:hover{border-color:var(--navy2);box-shadow:0 0 0 3px var(--navy-light)}
.gen-card-header{background:var(--navy);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between}
.gen-card-title{color:#fff;font-size:14px;font-weight:600}
.gen-card-serial{color:rgba(255,255,255,.65);font-size:11px;margin-top:1px}
.gen-card-body{padding:.875rem 1rem}
.gen-stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.gen-stat-row:last-child{border-bottom:none}
.gen-stat-label{color:var(--text2)}
.gen-stat-val{font-weight:600}
.gen-card-footer{background:var(--surface2);padding:.5rem 1rem;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}

/* ── KPI strip ── */
.kpi-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.25rem}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;min-width:100px;flex:1}
.kpi-card.danger{border-left:3px solid #F09595;background:var(--danger-bg)}
.kpi-card.warn{border-left:3px solid #EF9F27;background:var(--warn-bg)}
.kpi-card.ok{border-left:3px solid #97C459;background:var(--ok-bg)}
.kpi-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kpi-val{font-size:22px;font-weight:700;color:var(--text);line-height:1}
.kpi-val.danger{color:var(--danger-text)}
.kpi-val.warn{color:var(--warn-text)}
.kpi-val.ok{color:var(--ok-text)}
.kpi-unit{font-size:12px;font-weight:400;color:var(--text3)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:4px}

/* ── Unit layout ── */
.unit-layout{display:grid;grid-template-columns:1fr 400px;gap:14px;align-items:start}
@media(max-width:900px){.unit-layout{grid-template-columns:1fr}}
.charts-col{display:flex;flex-direction:column;gap:14px}

/* ── Chart card ── */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filter-label{font-size:11px;color:var(--text3);align-self:center}
.f-btn{padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.f-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;align-items:center}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-swatch{width:20px;height:3px;border-radius:2px;display:inline-block}

/* ── Table panel ── */
.table-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-panel-head{padding:.625rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.table-panel-title{font-size:12px;font-weight:600;color:var(--text)}
.table-panel-count{font-size:11px;color:var(--text3)}
.table-scroll{overflow-x:auto}
.tbl-wrap{overflow-x:auto;margin-top:.5rem}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:var(--navy);color:#fff;padding:7px 10px;text-align:left;font-size:11px;font-weight:500;white-space:nowrap}
.data-table td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap}
.data-table tbody tr{cursor:pointer;transition:background .1s}
.data-table tbody tr:hover{background:var(--surface2)}
.data-table tbody tr.selected{background:var(--navy-light)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table td.danger,.data-table td.warn,.data-table td.ok{font-weight:700}
.data-table td.danger{color:var(--danger-text)}
.data-table td.warn{color:var(--warn-text)}
.data-table td.ok{color:var(--ok-text)}

/* ── Side panel ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:96vw;background:var(--surface);z-index:201;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
.side-panel.open{transform:none}
.panel-head{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-shrink:0}
.panel-head-title{font-size:15px;font-weight:700;color:var(--navy)}
.panel-head-sub{font-size:12px;color:var(--text3);margin-top:2px}
.btn-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-close:hover{background:var(--danger-bg);color:var(--danger-text)}
.panel-body{flex:1;overflow-y:auto;padding:1.25rem}
.panel-actions{padding:.875rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.btn-pdf-panel{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-pdf-panel:hover{border-color:var(--navy2);color:var(--navy2)}
.btn-save-od{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);border:none;background:var(--navy);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-save-od:hover{background:var(--navy2)}
.btn-save-od:disabled{opacity:.5;cursor:not-allowed}

/* ── Detail panel sections ── */
.p-sec{margin-bottom:1rem}
.p-sec-title{font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--navy-light);padding-bottom:3px;margin-bottom:8px}
.p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.p-grid-2{grid-template-columns:repeat(2,1fr)}
.p-item .p-lbl{font-size:10px;color:var(--text3);margin-bottom:1px}
.p-item .p-val{font-size:13px;font-weight:600;color:var(--text)}
.p-item .p-val.danger{color:var(--danger-text)}
.p-item .p-val.warn{color:var(--warn-text)}
.p-item .p-val.ok{color:var(--ok-text)}
.delta-up{font-size:10px;color:#C55A11;font-weight:700}
.delta-dn{font-size:10px;color:#27500A;font-weight:700}
.imp-tbl{width:100%;border-collapse:collapse;font-size:11px}
.imp-tbl th{background:var(--navy);color:#fff;padding:5px 8px;font-size:10px;font-weight:500}
.imp-tbl td{padding:4px 8px;text-align:center;border-bottom:1px solid var(--border)}

/* ── Form ── */
.form-sec{margin-bottom:1rem}
.form-sec-title{font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--navy-light);padding-bottom:3px;margin-bottom:8px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.form-grid-3{grid-template-columns:repeat(3,1fr)}
.form-field{display:flex;flex-direction:column;gap:3px}
.form-lbl{font-size:10px;color:var(--text2);font-weight:600}
.form-input,.form-select{width:100%;padding:6px 8px;border:1px solid var(--border2);border-radius:5px;font-size:12px;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color .15s}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--navy2)}
textarea.form-input{resize:vertical}
.imp-tbl input[type=number]{width:100%;padding:4px 6px;border:1px solid var(--border2);border-radius:4px;font-size:11px;font-family:inherit;background:var(--surface)}
.btn-guardar{display:block;width:100%;padding:10px;border-radius:var(--radius);border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;transition:background .15s}
.btn-guardar:hover:not(:disabled){background:var(--navy2)}
.btn-guardar:disabled{opacity:.5;cursor:not-allowed}
.btn-pdf-form{display:block;width:100%;padding:8px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;transition:all .15s}
.btn-pdf-form:hover{border-color:var(--navy2);color:var(--navy2)}
.form-msg{margin-top:10px;padding:8px 12px;border-radius:var(--radius);font-size:12px;display:none}
.form-msg.ok{display:block;background:var(--ok-bg);color:var(--ok-text);border:1px solid var(--ok-border)}
.form-msg.err{display:block;background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-border)}
.form-msg.info{display:block;background:var(--accent-bg);color:var(--accent-text)}

/* ── Back button ── */
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:12px;transition:all .15s}
.back-btn:hover{border-color:var(--navy2);color:var(--navy2)}

/* ── OneDrive save indicator ── */
.od-indicator{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.od-indicator.saving{color:var(--warn-text);border-color:var(--warn-border);background:var(--warn-bg)}
.od-indicator.saved{color:var(--ok-text);border-color:var(--ok-border);background:var(--ok-bg)}
.od-indicator.error{color:var(--danger-text);border-color:var(--danger-border);background:var(--danger-bg)}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE — tablet 900px y móvil 640px / 400px
   (unit-layout ya tiene @media(max-width:900px) arriba)
═══════════════════════════════════════════════════════════════ */

/* ── Header: apila columnas en móvil ── */
@media(max-width:680px){
  .corp-header-inner{flex-direction:column;align-items:flex-start;gap:6px;padding:.75rem}
  .corp-meta{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
  .corp-meta-label{display:none}
  .corp-meta-value{font-size:11px}
  .auth-btn{font-size:11px;padding:5px 10px}
  .auth-user{max-width:160px}
}

/* ── Nav: tabs con scroll horizontal + acciones en segunda fila ── */
@media(max-width:680px){
  .nav-bar-inner{flex-wrap:wrap;padding:0 .75rem;gap:0}
  .nav-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1}
  .nav-tabs::-webkit-scrollbar{display:none}
  .nav-tab{padding:11px 12px;font-size:12px}
  .nav-actions{width:100%;border-top:1px solid var(--border);padding:5px 0;justify-content:flex-end;gap:6px}
  .btn-nueva,.btn-refresh{font-size:11px;padding:5px 10px}
}

/* ── Contenido: padding reducido ── */
@media(max-width:680px){
  .content{padding:.875rem .75rem}
  .gen-grid{grid-template-columns:1fr}
  .kpi-strip{gap:7px}
  .kpi-card{min-width:calc(50% - 4px);flex:1 1 calc(50% - 4px)}
  .kpi-val{font-size:18px}
}

/* ── Panel lateral: ancho completo en móvil ── */
@media(max-width:600px){
  .side-panel{width:100vw;max-width:100vw}
  .panel-actions{flex-direction:column}
  .btn-pdf-panel,.btn-save-od{width:100%;justify-content:center;text-align:center}
}

/* ── Grillas del panel de detalle ── */
@media(max-width:680px){
  .p-grid{grid-template-columns:repeat(2,1fr)}
  .p-grid-2{grid-template-columns:1fr}
}
@media(max-width:400px){
  .p-grid{grid-template-columns:1fr}
}

/* ── Grillas de formulario ── */
@media(max-width:680px){
  .form-grid{grid-template-columns:1fr}
  .form-grid-3{grid-template-columns:repeat(2,1fr)}
  .btn-guardar,.btn-pdf-form{font-size:13px}
}
@media(max-width:400px){
  .form-grid-3{grid-template-columns:1fr}
}

/* ── Filtros de gráfica: scroll horizontal en móvil ── */
@media(max-width:680px){
  .filter-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
  .filter-row::-webkit-scrollbar{display:none}
}

/* ── Tabla historial: asegurar scroll en cualquier ancho ── */
.table-scroll{-webkit-overflow-scrolling:touch}

/* ── KPI strip: 1 columna en pantallas muy pequeñas ── */
@media(max-width:360px){
  .kpi-card{min-width:100%;flex:1 1 100%}
}
</style>
</head>
<body>

<!-- ── Corporate header ── -->
<header class="corp-header">
  <div class="corp-header-inner">
    <div class="corp-brand">
      <div class="corp-logo-mark">BE</div>
      <div>
        <div class="corp-logo-text">Bijao Electric Company</div>
        <div class="corp-logo-sub">Pruebas Eléctricas — Generadores</div>
      </div>
    </div>
    <div class="corp-meta">
      <div id="authArea" class="auth-status">
        <button class="auth-btn" id="btnLogin" onclick="signIn()">
          <svg class="ms-logo" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>

function g(row, key){ return row[H[key]] !== undefined ? row[H[key]] : row[key]; }
function num(v, dec=2){ const f=parseFloat(v); return isNaN(f)?'—':f.toFixed(dec); }
function numRaw(v){ const f=parseFloat(v); return isNaN(f)?null:f; }

function piClass(v){ const f=parseFloat(v); if(isNaN(f))return''; if(f<1.5)return'danger'; if(f<2.0)return'warn'; return'ok'; }
function irClass(v){ const f=parseFloat(v); if(isNaN(f))return''; if(f<=0.01||f<50)return'danger'; if(f<100)return'warn'; return'ok'; }
function badge(cls){ return cls==='danger'?'badge-danger':cls==='warn'?'badge-warn':cls==='ok'?'badge-ok':'badge-accent'; }
function getUnit(n){ return ALL.filter(r=>g(r,'unit')==='U'+n).sort((a,b)=>Number(g(a,'year'))-Number(g(b,'year'))); }
function lastRow(n){ const rows=getUnit(n); return rows[rows.length-1]; }
function minPI(row){ const vals=[g(row,'piUE'),g(row,'piVE'),g(row,'piWE')].map(parseFloat).filter(v=>!isNaN(v)); return vals.length?Math.min(...vals):null; }
function overallClass(row){ const pi=minPI(row); const ir=parseFloat(g(row,'p3p')); if((!isNaN(ir)&&ir<=0.01)||(!isNaN(pi)&&pi<1.5))return'danger'; if((!isNaN(pi)&&pi<2.0)||(!isNaN(ir)&&ir<100))return'warn'; return'ok'; }
function overallLabel(cls){ return cls==='danger'?'CRÍTICO':cls==='warn'?'ATENCIÓN':'NORMAL'; }
function eventBadge(tipo){ if(!tipo)return''; const post=tipo.toLowerCase().includes('post'); return `<span class="badge ${post?'badge-post':'badge-accent'}">${post?'Post-Rep.':'Mto. Anual'}</span>`; }

async function initAuth(){
  if(typeof msal === 'undefined'){
    console.error('MSAL no cargó correctamente');
    document.getElementById('screen-home').innerHTML =
      '<div class="loading-wrap"><div style="color:#791F1F;font-size:13px">Error cargando librería de autenticación.<br><span style="font-size:12px;color:var(--text3)">Verifica tu conexión a internet y recarga la página.</span></div></div>';
    return;
  }
  msalInstance = new msal.PublicClientApplication(msalConfig);
  await msalInstance.initialize();
  try { await msalInstance.handleRedirectPromise(); } catch(e){}

  const accounts = msalInstance.getAllAccounts();
  if(accounts.length > 0){
    currentUser = accounts[0];
    onSignedIn();
  } else {
    showAuthWall();
  }
}

async function signIn(){
  try {
    const result = await msalInstance.loginPopup({ scopes: SCOPES });
    currentUser = result.account;
    onSignedIn();
  } catch(e) {
    console.error('Login error:', e);
  }
}

async function signOut(){
  await msalInstance.logoutPopup({ account: currentUser });
  currentUser = null;
  ALL = [];
  onSignedOut();
}

async function getToken(){
  if(!currentUser) throw new Error('No hay sesión activa');
  try {
    const r = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: currentUser });
    return r.accessToken;
  } catch(e) {
    const r = await msalInstance.acquireTokenPopup({ scopes: SCOPES, account: currentUser });
    return r.accessToken;
  }
}

function onSignedIn(){
  document.getElementById('authArea').innerHTML = `

// Construye la URL base de un item por ruta dentro del Drive
function driveItemUrl(path){
  // Codificar cada segmento individualmente preservando las barras
  const encoded = path.split('/').map(s => encodeURIComponent(s)).join('/');
  return `${GRAPH_BASE}/drives/${DRIVE_ID}/root:/${encoded}`;
}

// Verifica si una carpeta existe en OneDrive
async function folderExists(token, path){
  const encoded = path.split('/').map(s => encodeURIComponent(s)).join('/');
  const res = await fetch(`${GRAPH_BASE}/drives/${DRIVE_ID}/root:/${encoded}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  return res.ok;
}

// Crea una carpeta solo si no existe
async function ensureFolder(token, parentPath, folderName){
  const fullPath = parentPath ? `${parentPath}/${folderName}` : folderName;
  if(await folderExists(token, fullPath)) return; // ya existe, no hacer nada
  const encodedParent = parentPath
    ? parentPath.split('/').map(s => encodeURIComponent(s)).join('/')
    : '';
  const parentUrl = encodedParent
    ? `${GRAPH_BASE}/drives/${DRIVE_ID}/root:/${encodedParent}:/children`
    : `${GRAPH_BASE}/drives/${DRIVE_ID}/root/children`;
  await fetch(parentUrl, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: folderName, folder: {}, '@microsoft.graph.conflictBehavior': 'rename' })
  });
}

// Inicializa la estructura de carpetas si no existe
async function ensureFolderStructure(token){
  await ensureFolder(token, 'Manto_Electrico', 'Pruebas de Generadores');
  for(const u of [1,2,3]){
    await ensureFolder(token, OD_ROOT, OD_FOLDERS[u]);
  }
}

// Lee el JSON de datos de una unidad
async function readUnitData(token, unitNum){
  const path = `${OD_ROOT}/${OD_FOLDERS[unitNum]}/datos.json`;
  const url = `${driveItemUrl(path)}:/content`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if(res.status === 404) return [];
  if(!res.ok) throw new Error(`Error leyendo Unidad ${unitNum}: ${res.status}`);
  return await res.json();
}

// Escribe el JSON de datos de una unidad
async function writeUnitData(token, unitNum, data){
  const path = `${OD_ROOT}/${OD_FOLDERS[unitNum]}/datos.json`;
  const url = `${driveItemUrl(path)}:/content`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(data, null, 2)
  });
  if(!res.ok) throw new Error(`Error guardando Unidad ${unitNum}: ${res.status}`);
  return res.json();
}

// Guarda un informe HTML en OneDrive
async function writeInformeHTML(token, unitNum, anio, htmlContent){
  const fileName = `Informe_U${unitNum}_${anio}.html`;
  const path = `${OD_ROOT}/${OD_FOLDERS[unitNum]}/${fileName}`;
  const url = `${driveItemUrl(path)}:/content`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'text/html' },
    body: htmlContent
  });
  if(!res.ok) throw new Error(`Error guardando informe: ${res.status}`);
  return res.json();
}

// CARGAR DATOS DESDE ONEDRIVE
// ═══════════════════════════════════════════════════════════════════════
async function loadData(){
  if(!currentUser){ showAuthWall(); return; }
  const dot = document.getElementById('connDot');
  dot.className = 'conn-dot loading';
  const showStatus = msg => {
    document.getElementById('screen-home').innerHTML =
      `<div class="loading-wrap"><div class="spinner"></div><span style="color:var(--text3);font-size:13px">${msg}</span></div>`;
  };
  try {
    showStatus('Obteniendo token...');
    const token = await getToken();
    showStatus('Verificando carpetas en OneDrive...');
    await ensureFolderStructure(token);
    showStatus('Cargando datos U1...');
    const u1 = await readUnitData(token, 1);
    showStatus(`U1: ${u1.length} campañas — Cargando U2...`);
    const u2 = await readUnitData(token, 2);
    showStatus(`U2: ${u2.length} campañas — Cargando U3...`);
    const u3 = await readUnitData(token, 3);

    ALL = [...u1, ...u2, ...u3];

    if(ALL.length === 0){
      dot.className = 'conn-dot error';
      document.getElementById('hdr-fecha').textContent = 'Sin datos';
      document.getElementById('screen-home').innerHTML =
        `<div class="loading-wrap"><div style="color:#633806;font-size:13px">
          Conexión OK pero no se encontraron datos.<br>
          <span style="font-size:12px;color:var(--text3)">
            Verifica que los archivos estén en:<br>
            <code>Pruebas de Generadores/Unidad 1/datos.json</code>
          </span>
        </div></div>`;
      return;
    }

    const now = new Date().toLocaleString('es-HN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    document.getElementById('hdr-fecha').textContent = now;
    dot.className = 'conn-dot';
    refresh();
  } catch(err) {
    dot.className = 'conn-dot error';
    document.getElementById('hdr-fecha').textContent = 'Error de conexión';
    console.error('loadData error:', err);
    document.getElementById('screen-home').innerHTML =
      `<div class="loading-wrap"><div style="color:#791F1F;font-size:13px;max-width:500px;text-align:center">
        Error al cargar datos de OneDrive.<br>
        <span style="font-size:12px;color:var(--text3)">${err.message}</span><br><br>
        <button onclick="loadData()" style="padding:6px 16px;border-radius:6px;border:1px solid #C3C2B7;background:#fff;cursor:pointer;font-size:12px">
          Reintentar
        </button>
      </div></div>`;
  }
}

function reloadData(){ loadData(); }

// GUARDAR CAMPAÑA EN ONEDRIVE
// ═══════════════════════════════════════════════════════════════════════
async function saveCampaign(unitNum, newRecord){
  const token = await getToken();
  let existing = [];
  try { existing = await readUnitData(token, unitNum); } catch(e){}
  // Reemplazar si ya existe el mismo año
  const idx = existing.findIndex(r => String(r.anio) === String(newRecord.anio) && r.unidad === newRecord.unidad);
  if(idx >= 0) existing[idx] = newRecord;
  else existing.push(newRecord);
  existing.sort((a,b) => Number(a.anio) - Number(b.anio));
  await writeUnitData(token, unitNum, existing);
}

      {label:'U1-V1 (mΩ)',data:rows.map(r=>numRaw(g(r,'p6u1v1'))),borderColor:'#1F3864',backgroundColor:'#1F386420',tension:.3,pointRadius:4,pointBackgroundColor:'#1F3864',pointBorderColor:'#fff',pointBorderWidth:2,spanGaps:false},
      {label:'V1-W1 (mΩ)',data:rows.map(r=>numRaw(g(r,'p6v1w1'))),borderColor:'#1baf7a',backgroundColor:'#1baf7a20',tension:.3,pointRadius:4,pointBackgroundColor:'#1baf7a',pointBorderColor:'#fff',pointBorderWidth:2,spanGaps:false},
      {label:'W1-U1 (mΩ)',data:rows.map(r=>numRaw(g(r,'p6w1u1'))),borderColor:'#C55A11',backgroundColor:'#C55A1120',tension:.3,pointRadius:4,pointBackgroundColor:'#C55A11',pointBorderColor:'#fff',pointBorderWidth:2,spanGaps:false},
    ]; yTitle='Resist. Devanado Rotor Excitador (mΩ)';

    const impRows=rows.filter(r=>numRaw(g(r,'z1v'))!==null); const impColors=['#1F3864','#C55A11','#1baf7a','#9B59B6'];

    return;
  }

  CHARTS['chartG'+n]=new Chart(ctx,{type:'line',data:{labels:years,datasets},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:'top',align:'end',labels:{font:{size:11},boxWidth:16,boxHeight:2,padding:10}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{color:GRID},ticks:{color:TMUTED,font:{size:10}}},y:{type:yLog?'logarithmic':'linear',grid:{color:GRID},ticks:{color:TMUTED,font:{size:10}},title:{display:true,text:yTitle,color:TSEC,font:{size:10}}}}}});
}

    <div class="p-item"><div class="p-lbl">U-E 1min</div><div class="p-val">${v('ue1',3)} GΩ</div></div>

    <div class="p-item"><div class="p-lbl">PI V-E</div><div class="p-val ${piClass(g(row,'piVE'))}">${v('piVE',2)}${delta('piVE')}</div></div>
    <div class="p-item"><div class="p-lbl">W-E 1min</div><div class="p-val">${v('we1',3)} GΩ</div></div>
    <div class="p-item"><div class="p-lbl">W-E 10min</div><div class="p-val">${v('we10',3)} GΩ</div></div>

  <div class="p-sec"><div class="p-sec-title">P2 — Resist. Devanado Estátor (mΩ)</div><div class="p-grid">

function buildInformeHTML(n, idx){
  const rows=getUnit(n); const row=rows[idx!==undefined?idx:rows.length-1];

  const styles=`<style>

    .hdr p{font-size:10px;color:#85B7EB}

    td{padding:5px 8px;border-bottom:1px solid #E1E0D9;color:#52514E;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    td:first-child{font-weight:600;color:#0B0B0B}

    .footer{margin-top:18px;padding-top:8px;border-top:1px solid #E1E0D9;font-size:9px;color:#898781;display:flex;justify-content:space-between}
    @media print{body{padding:12px}}
  </style>`;

  function fv(key,dec=2){ return num(g(row,key),dec); }

    </table></div>`:'';
  const cls=overallClass(row);

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Prueba Eléctrica — U${n} ${anio}</title>${styles}</head><body>
  <div class="hdr">

  <div class="sec"><div class="sec-title">P1 — IR Estátor Principal (GΩ) / Índice de Polarización</div>

      <tr><td>V-E</td><td>${fv('ve1',3)}</td><td>${fv('ve10',3)}</td><td>${fv('piVE',2)}</td><td><span class="badge badge-${piCl(g(row,'piVE'))}">${fv('piVE',2)}</span></td></tr>
      <tr><td>W-E</td><td>${fv('we1',3)}</td><td>${fv('we10',3)}</td><td>${fv('piWE',2)}</td><td><span class="badge badge-${piCl(g(row,'piWE'))}">${fv('piWE',2)}</span></td></tr>
    </tbody></table>
  </div>
  <div class="sec"><div class="sec-title">P2 — Resist. Devanado Estátor (mΩ)</div><div class="grid">
    <div class="item"><div class="lbl">Fase U</div><div class="val">${fv('p2u',3)}</div></div>
    <div class="item"><div class="lbl">Fase V</div><div class="val">${fv('p2v',3)}</div></div>

    <table><thead><tr><th>Medición</th><th>Valor</th><th>Simetría</th><th>Estado</th></tr></thead>
    <tbody>
      <tr><td>Campo (+) a E</td><td>${fv('p3p',1)} MΩ</td><td rowspan="2">${g(row,'p3obs')||'—'}</td><td><span class="badge badge-${irCl(g(row,'p3p'))}">${irCl(g(row,'p3p'))==='ok'?'Normal':irCl(g(row,'p3p'))==='warn'?'Atención':'Crítico'}</span></td></tr>
      <tr><td>Campo (−) a E</td><td>${fv('p3m',1)} MΩ</td><td><span class="badge badge-${irCl(g(row,'p3m'))}">${irCl(g(row,'p3m'))==='ok'?'Normal':irCl(g(row,'p3m'))==='warn'?'Atención':'Crítico'}</span></td></tr>
      <tr><td>(+)→(−) Resist.</td><td>${fv('p4',1)} mΩ</td><td>—</td><td>—</td></tr>

// ── Referencia al último PDF generado ────────────────────────────────
let _pdfB64 = null, _pdfUnit = null, _pdfIdx = null;

// ── Genera PDF con jsPDF y devuelve base64 ───────────────────────────
function buildPDF(n, idx){
  const rows = getUnit(n);
  const row  = rows[idx !== undefined ? idx : rows.length - 1];
  const { jsPDF } = window.jspdf;
  const doc  = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
  const PW = 215.9, PH = 279.4;
  const fv  = (key, dec=2) => num(g(row,key), dec);
  const piC = v => { const f=parseFloat(v); return isNaN(f)?[137,135,129]:f<1.5?[127,31,31]:f<2?[99,56,6]:[39,80,10]; };
  const irC = v => { const f=parseFloat(v); return isNaN(f)?[137,135,129]:(f<=0.01||f<50)?[127,31,31]:f<100?[99,56,6]:[39,80,10]; };
  const anio=g(row,'year'), tipo=g(row,'tipo')||'';

  // ── OPCIÓN E + LOGO: encabezado navy con logo BECO izquierda ────────
  const fEmision=new Date().toLocaleDateString('es-HN',{day:'2-digit',month:'short',year:'numeric'});
  const cls=overallClass(row);
  const clsC=cls==='danger'?[127,31,31]:cls==='warn'?[99,56,6]:[39,80,10];
  const clsB=cls==='danger'?[252,235,235]:cls==='warn'?[250,238,218]:[234,243,222];

  // Franja navy 26mm para acomodar logo
  doc.setFillColor(31,56,100); doc.rect(0,0,PW,26,'F');
  doc.setDrawColor(46,94,158); doc.setLineWidth(0.4); doc.line(0,26,PW,26);

  // Logo BECO — lado izquierdo dentro de la franja navy
  doc.addImage(LOGO_B64,'PNG',3,1,22,24);

  // Texto empresa — desde x=28 para dar espacio al logo
  doc.setTextColor(255,255,255); doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('Bijao Electric Company  ·  Prueba Eléctrica de Generador',28,9);
  doc.setFontSize(8); doc.setFont(undefined,'normal'); doc.setTextColor(180,205,230);
  doc.text(`Generador ${n}  ·  U${n} (${SERIALS[n]})  ·  ${tipo}`,28,14);
  doc.setFontSize(7.5); doc.setFont(undefined,'normal'); doc.setTextColor(184,212,238);
  doc.text(`Fecha: ${g(row,'fecha')||'—'}   ·   OT No.: ${g(row,'ot')||'—'}`,28,21);

  // Derecha — fecha y campaña
  doc.setFontSize(7.5); doc.setTextColor(180,205,230);
  doc.text(fEmision,PW-14,8,{align:'right'});
  doc.setFontSize(9); doc.setFont(undefined,'bold'); doc.setTextColor(255,255,255);
  doc.text(`U${n} — ${anio}`,PW-14,17,{align:'right'});

  // Badge estado debajo de la franja
  doc.setFillColor(...clsB); doc.roundedRect(PW-14-24,28,26,7,2,2,'F');
  doc.setTextColor(...clsC); doc.setFontSize(7); doc.setFont(undefined,'bold');
  doc.text(overallLabel(cls),PW-14,33,{align:'right'});

  // ── Helpers ────────────────────────────────────────────────────────
  let y=38;

  // secT compacto: 5mm en vez de 6
  const secT=(t)=>{
    doc.setFontSize(7); doc.setFont(undefined,'bold'); doc.setTextColor(31,56,100);
    doc.text(t.toUpperCase(),14,y);
    doc.setDrawColor(213,232,240); doc.setLineWidth(0.3); doc.line(14,y+1,PW-14,y+1);
    y+=5;
  };

  // g3: filas de 10mm en vez de 12
  const g3=(items)=>{
    const cW=(PW-28)/3;
    items.forEach((it,i)=>{
      const x=14+(i%3)*cW;
      if(i%3===0&&i>0) y+=10;
      doc.setFontSize(7); doc.setFont(undefined,'normal'); doc.setTextColor(137,135,129);
      doc.text(it.label||'',x,y);
      doc.setFontSize(9); doc.setFont(undefined,'bold'); doc.setTextColor(...(it.color||[11,11,11]));
      doc.text(it.val||'',x,y+4.5);
    });
    y+=10;
  };

  // tbl: filas de 6mm en vez de 7, header 7mm en vez de 8
  const tbl=(hdrs,rows2,cW2)=>{
    const sx=14;
    doc.setFillColor(31,56,100); doc.rect(sx,y-3.5,PW-28,7,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7.5); doc.setFont(undefined,'bold');
    let cx=sx+2; hdrs.forEach((h,i)=>{doc.text(h,cx,y);cx+=cW2[i];});
    y+=4.5; doc.setFont(undefined,'normal'); doc.setTextColor(82,81,78); doc.setFontSize(7.5);
    rows2.forEach((r2,ri)=>{
      if(ri%2===0){doc.setFillColor(248,248,246);doc.rect(sx,y-3.5,PW-28,6,'F');}
      cx=sx+2;
      r2.forEach((cell,i)=>{
        if(typeof cell==='object'){doc.setTextColor(...cell.color);doc.text(cell.text,cx,y);doc.setTextColor(82,81,78);}
        else doc.text(String(cell),cx,y);
        cx+=cW2[i];
      });
      y+=6;
    });
    y+=3;
  };

  // tblImp: P10 en 2 columnas paralelas — ahorra ~30mm de altura
  const tblImp=(impRows)=>{
    const half=Math.ceil(impRows.length/2);
    const left=impRows.slice(0,half); const right=impRows.slice(half);
    const colW=(PW-28)/2-3; const gap=6; const sx=14; const midX=sx+colW+gap;
    const hdrs=['Pto','V','I (A)','Z (Ω)'];
    const cW=[10,22,30,colW-62];
    // Headers
    doc.setFillColor(31,56,100);
    doc.rect(sx,y-3.5,colW,7,'F'); doc.rect(midX,y-3.5,colW,7,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(7.5); doc.setFont(undefined,'bold');
    let cx=sx+2; hdrs.forEach((h,i)=>{doc.text(h,cx,y);cx+=cW[i];});
    cx=midX+2; hdrs.forEach((h,i)=>{doc.text(h,cx,y);cx+=cW[i];});
    y+=4.5;
    doc.setFont(undefined,'normal'); doc.setTextColor(82,81,78); doc.setFontSize(7.5);
    const maxR=Math.max(left.length,right.length);
    for(let ri=0;ri<maxR;ri++){
      if(ri%2===0){
        doc.setFillColor(248,248,246);
        doc.rect(sx,y-3.5,colW,6,'F');
        if(right[ri]) doc.rect(midX,y-3.5,colW,6,'F');
      }
      if(left[ri]){
        cx=sx+2; left[ri].forEach((cell,i)=>{
          if(typeof cell==='object'){doc.setTextColor(...cell.color);doc.text(cell.text,cx,y);doc.setTextColor(82,81,78);}
          else doc.text(String(cell),cx,y); cx+=cW[i];
        });
      }
      if(right[ri]){
        cx=midX+2; right[ri].forEach((cell,i)=>{
          if(typeof cell==='object'){doc.setTextColor(...cell.color);doc.text(cell.text,cx,y);doc.setTextColor(82,81,78);}
          else doc.text(String(cell),cx,y); cx+=cW[i];
        });
      }
      y+=6;
    }
    y+=3;
  };

  // ── Secciones ──────────────────────────────────────────────────────
  secT('P1 — IR Estátor Principal (GΩ) / Índice de Polarización');
  tbl(['Fase','1min(GΩ)','10min(GΩ)','PI','Estado'],
    [['U-E',fv('ue1',3),fv('ue10',3),fv('piUE',2),{text:parseFloat(g(row,'piUE'))<1.5?'Crítico':parseFloat(g(row,'piUE'))<2?'Atención':'Normal',color:piC(g(row,'piUE'))}],
     ['V-E',fv('ve1',3),fv('ve10',3),fv('piVE',2),{text:parseFloat(g(row,'piVE'))<1.5?'Crítico':parseFloat(g(row,'piVE'))<2?'Atención':'Normal',color:piC(g(row,'piVE'))}],
     ['W-E',fv('we1',3),fv('we10',3),fv('piWE',2),{text:parseFloat(g(row,'piWE'))<1.5?'Crítico':parseFloat(g(row,'piWE'))<2?'Atención':'Normal',color:piC(g(row,'piWE'))}]],
    [14,36,36,22,60]);

  secT('P2 — Resistencia Devanado Estátor (mΩ)');
  g3([{label:'Fase U (mΩ)',val:fv('p2u',3)},{label:'Fase V (mΩ)',val:fv('p2v',3)},{label:'Fase W (mΩ)',val:fv('p2w',3)}]);

  secT('P3 — IR Rotor Principal (MΩ)  ·  P4 — Resistencia Rotor (mΩ)');
  tbl(['Medición','Valor','Simetría','Estado'],
    [['Campo (+) a E',fv('p3p',1)+' MΩ',g(row,'p3obs')||'—',{text:parseFloat(g(row,'p3p'))<=0.01||parseFloat(g(row,'p3p'))<50?'Crítico':parseFloat(g(row,'p3p'))<100?'Atención':'Normal',color:irC(g(row,'p3p'))}],
     ['Campo (−) a E',fv('p3m',1)+' MΩ','—',{text:parseFloat(g(row,'p3m'))<=0.01||parseFloat(g(row,'p3m'))<50?'Crítico':parseFloat(g(row,'p3m'))<100?'Atención':'Normal',color:irC(g(row,'p3m'))}],
     ['(+)→(−) Resist.',fv('p4',1)+' mΩ','—','—']],
    [50,40,50,40]);

  secT('P5 — IR & Resistencia Estátor Excitador');
  g3([{label:'J a Tierra (GΩ)',val:fv('p5j',3)},{label:'K a Tierra (GΩ)',val:fv('p5k',3)},{label:'J-K Resist. (Ω)',val:fv('p5jk',3)}]);

  secT('P6 — Rotor Excitador  ·  P7 — PMG');
  tbl(['Prueba','UVW-E IR (MΩ)','U1-V1 (mΩ)','V1-W1 (mΩ)','W1-U1 (mΩ)'],
    [['P6 Exc. Rotor',fv('p6ir',1),fv('p6u1v1',3),fv('p6v1w1',3),fv('p6w1u1',3)],
     ['P7 PMG',fv('p7ir',1),fv('p7u1v1',3),fv('p7v1w1',3),fv('p7w1u1',3)]],
    [35,35,35,35,35]);

  secT('P8 — Diodo (V)  ·  P9 — Escobillas (mm)');
  g3([{label:'Forward Bias (V)',val:fv('p8f',3)},{label:'Reverse Bias (V)',val:fv('p8r',3)},{label:'',val:''},
      {label:'SR-1 (mm)',val:fv('p9s1',2)},{label:'SR-2 (mm)',val:fv('p9s2',2)},{label:'',val:''}]);

  // P10 en 2 columnas
  const hasImp=numRaw(g(row,'z1v'))!==null;
  if(hasImp){
    secT('P10 — Impedancia Rotor Principal');
    const impKeys=[['z1v','z1i','z1z'],['z2v','z2i','z2z'],['z3v','z3i','z3z'],['z4v','z4i','z4z'],['z5v','z5i','z5z'],['z6v','z6i','z6z'],['z7v','z7i','z7z']];
    const impRows=impKeys.filter(k=>numRaw(g(row,k[0]))!==null).map((k,i)=>[
      String(i+1), num(g(row,k[0]),0)+' V', num(g(row,k[1]),4)+' A',
      {text:num(g(row,k[2]),2)+' Ω',color:[46,94,158]}
    ]);
    tblImp(impRows);
  }


  if(g(row,'obs')){
    secT('Observaciones');
    doc.setFontSize(8); doc.setFont(undefined,'normal'); doc.setTextColor(82,81,78);
    const lines=doc.splitTextToSize(g(row,'obs'),PW-28);
    doc.text(lines,14,y); y+=lines.length*4.5+4;
  }

  // ── Comparación vs campaña anterior ────────────────────────────────
  const prevRow = rows.length > 1 ? rows[rows.length - 2] : null;
  if(prevRow){
    secT('Variación respecto a campaña anterior — ' + (g(prevRow,'year')||'prev.'));
    const delta=(key,dec,unit,lbl)=>{
      const cur=parseFloat(g(row,key)); const prv=parseFloat(g(prevRow,key));
      if(isNaN(cur)||isNaN(prv)) return {label:lbl,val:'—',color:[137,135,129]};
      const d=cur-prv; const sign=d>=0?'+':'';
      const col=Math.abs(d)<0.01?[137,135,129]:d>0?[99,56,6]:[39,80,10];
      return {label:lbl,val:`${sign}${d.toFixed(dec)} ${unit}  (${num(cur,dec)})`,color:col};
    };
    g3([delta('piUE',2,'','PI U-E'),delta('piVE',2,'','PI V-E'),delta('piWE',2,'','PI W-E'),
        delta('p3p',1,'MΩ','IR Rot.(+)'),delta('p9s1',1,'mm','SR-1'),delta('p9s2',1,'mm','SR-2')]);
  }

  // ── Responsables — siempre al final ────────────────────────────────
  y+=5;
  doc.setDrawColor(200,198,190); doc.setLineWidth(0.25); doc.line(14,y,PW-14,y);
  y+=6;
  doc.setFontSize(8); doc.setFont(undefined,'normal'); doc.setTextColor(137,135,129);
  doc.text('Ejecutado por:', 14, y);
  doc.text('Técnico:', PW/2+4, y);
  doc.setFont(undefined,'bold'); doc.setTextColor(11,11,11);
  doc.text(g(row,'sup')||'—', 44, y);
  doc.text(g(row,'tec')||'—', PW/2+22, y);
  y+=5;

  // Footer
  doc.setDrawColor(225,224,217); doc.setLineWidth(0.3); doc.line(14,PH-14,PW-14,PH-14);
  doc.setFontSize(7); doc.setTextColor(137,135,129); doc.setFont(undefined,'normal');
  doc.text('Bijao Electric Company S.A. de C.V.  |  Departamento de Mantenimiento Eléctrico',14,PH-9);
  doc.text(`Generado: ${new Date().toLocaleString('es-HN')}`,PW-14,PH-9,{align:'right'});

  return doc.output('datauristring').split(',')[1];
}

function triggerPanelPDF(){
  if(currentPanelUnit===null) return;
  const rows=getUnit(currentPanelUnit);
  const idx=currentPanelIdx!==null?currentPanelIdx:rows.length-1;
  const b64=buildPDF(currentPanelUnit,idx);
  _pdfB64=b64; _pdfUnit=currentPanelUnit; _pdfIdx=idx;
  const byteStr=atob(b64); const ab=new ArrayBuffer(byteStr.length); const ia=new Uint8Array(ab);
  for(let i=0;i<byteStr.length;i++) ia[i]=byteStr.charCodeAt(i);
  const blob=new Blob([ab],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const win=window.open(url,'_blank');
  if(win) win.focus();
}

// Pre-genera el PDF en segundo plano y verifica si ya existe en OneDrive
async function preGenerarYVerificar(n, idx){
  const ind=document.getElementById('odIndicator');
  const btn=document.getElementById('btnSaveOD');
  // Generar PDF en segundo plano si no está cacheado
  if(!_pdfB64||_pdfUnit!==n||_pdfIdx!==idx){
    _pdfB64=buildPDF(n,idx); _pdfUnit=n; _pdfIdx=idx;
  }
  // Verificar si ya existe en OneDrive
  try {
    const token=await getToken();
    const rows=getUnit(n); const row=rows[idx]; const anio=g(row,'year');
    const fileName=`Informe_U${n}_${anio}.pdf`;
    const path=`${OD_ROOT}/${OD_FOLDERS[n]}/${fileName}`;
    const checkUrl=`${driveItemUrl(path)}`;
    const res=await fetch(checkUrl,{headers:{Authorization:`Bearer ${token}`}});
    if(res.ok){
      // Ya existe — mostrar advertencia en el indicador
      ind.style.display='inline-flex'; ind.className='od-indicator warn';
      ind.style.background='var(--warn-bg)'; ind.style.color='var(--warn-text)';
      ind.style.border='1px solid var(--warn-border)';
      ind.textContent=`⚠ ${fileName} ya existe`;
      btn.textContent='☁ Sobreescribir';
    } else {
      // No existe — listo para guardar
      ind.style.display='none';
      btn.textContent='☁ Guardar en OneDrive';
    }
  } catch(e){ /* sin conexión o token pendiente — no mostrar nada */ }
}

async function triggerSaveInforme(){
  if(currentPanelUnit===null) return;
  const rows=getUnit(currentPanelUnit);
  const idx=currentPanelIdx!==null?currentPanelIdx:rows.length-1;
  const row=rows[idx]; const anio=g(row,'year');
  const btn=document.getElementById('btnSaveOD');
  const ind=document.getElementById('odIndicator');
  const fileName=`Informe_U${currentPanelUnit}_${anio}.pdf`;

  // Si ya existe, pedir confirmación
  const yaExiste=ind.textContent.includes('ya existe');
  if(yaExiste){
    const ok=confirm(`"${fileName}" ya está guardado en OneDrive.

¿Deseas sobreescribir el archivo existente?`);
    if(!ok) return;
  }

  btn.disabled=true; btn.textContent='Subiendo...';
  ind.style.display='inline-flex'; ind.className='od-indicator saving';
  ind.style.background=''; ind.style.color=''; ind.style.border='';
  ind.textContent='⟳ Subiendo a OneDrive...';
  try {
    const token=await getToken();
    // Usar PDF pre-generado si está disponible, si no generar ahora
    const b64=(_pdfUnit===currentPanelUnit&&_pdfIdx===idx&&_pdfB64)?_pdfB64:buildPDF(currentPanelUnit,idx);
    _pdfB64=b64; _pdfUnit=currentPanelUnit; _pdfIdx=idx;
    const path=`${OD_ROOT}/${OD_FOLDERS[currentPanelUnit]}/${fileName}`;
    const url=`${driveItemUrl(path)}:/content`;
    const byteStr=atob(b64); const ab=new ArrayBuffer(byteStr.length); const ia=new Uint8Array(ab);
    for(let i=0;i<byteStr.length;i++) ia[i]=byteStr.charCodeAt(i);
    const blob=new Blob([ab],{type:'application/pdf'});
    const res=await fetch(url,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/pdf'},body:blob});
    if(!res.ok){ const j=await res.json().catch(()=>({})); throw new Error(`${res.status}: ${j?.error?.message||'Error al subir'}`); }
    ind.className='od-indicator saved';
    ind.style.background=''; ind.style.color=''; ind.style.border='';
    ind.textContent=`✓ Guardado: ${fileName}`;
    btn.textContent='☁ Guardar en OneDrive'; btn.disabled=false;
  } catch(err){
    ind.className='od-indicator error';
    ind.style.background=''; ind.style.color=''; ind.style.border='';
    ind.textContent='✗ '+err.message;
    btn.textContent='☁ Guardar en OneDrive'; btn.disabled=false;
  }
}

function cerrarModalCorreo(){

function agregarDestinatarioExtra(){
  const inp=document.getElementById('dest-extra-input');
  const email=inp.value.trim();
  if(!email||!email.includes('@')) return;
  if(!_destExtras.includes(email)) _destExtras.push(email);
  inp.value=''; renderDestExtras();
}

function renderDestExtras(){
  document.getElementById('dest-extra-lista').innerHTML=_destExtras.map(e=>
    `<span style="background:var(--accent-bg);color:var(--accent-text);font-size:11px;padding:3px 8px;border-radius:12px;display:inline-flex;align-items:center;gap:4px">
      ${e}<span onclick="quitarExtra('${e}')" style="cursor:pointer;font-size:15px;line-height:1">&times;</span>
    </span>`).join('');
}

function quitarExtra(email){ _destExtras=_destExtras.filter(e=>e!==email); renderDestExtras(); }

async function enviarInformeCorreo(){
  const fijos=[
    {id:'dest-cristhyan',email:'cvallejo@beco.hn'},
    {id:'dest-martin',   email:'mjimenez@beco.hn'},
    {id:'dest-samir',    email:'szavala@beco.hn'},
    {id:'dest-lenin',    email:'lcastro@beco.hn'},
  ];
  const destinatarios=[
    ...fijos.filter(f=>document.getElementById(f.id)?.checked).map(f=>f.email),
    ..._destExtras
  ];
  const stEl=document.getElementById('modal-correo-status');
  if(!destinatarios.length){ stEl.style.color='var(--danger-text)'; stEl.textContent='Selecciona al menos un destinatario.'; return; }
  const btn=document.getElementById('btn-enviar-correo');
  btn.disabled=true; btn.textContent='Enviando...';
  stEl.style.color='var(--text3)'; stEl.textContent='Enviando correo...';
  try {
    const token=await getToken();
    const rows=getUnit(_pdfUnit);
    const row=rows[_pdfIdx];
    const anio=g(row,'year');
    const sup=g(row,'sup')||'—';
    const fileName=`Informe_U${_pdfUnit}_${anio}.pdf`;
    const asunto=`Prueba Eléctrica Generador U${_pdfUnit} — Campaña ${anio} · BECO`;
    const cuerpo=`<p>Estimado(a),</p>
      <p>Se adjunta el informe de prueba eléctrica del <strong>Generador ${_pdfUnit} (U${_pdfUnit})</strong>, campaña <strong>${anio}</strong>.</p>
      <p>Emitido por: <strong>${sup}</strong><br>Bijao Electric Company S.A. de C.V.</p>`;
    const res=await fetch('https://graph.microsoft.com/v1.0/me/sendMail',{
      method:'POST',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({
        message:{
          subject:asunto,
          body:{contentType:'HTML',content:cuerpo},
          toRecipients:destinatarios.map(e=>({emailAddress:{address:e}})),
          attachments:[{'@odata.type':'#microsoft.graph.fileAttachment',name:fileName,contentType:'application/pdf',contentBytes:_pdfB64}]
        },
        saveToSentItems:true
      })
    });
    if(!res.ok){const j=await res.json();throw new Error(j.error?.message||res.status);}
    stEl.style.color='var(--ok-text)'; stEl.textContent='✓ Correo enviado correctamente.';
    btn.textContent='📧 Enviar';
    setTimeout(()=>cerrarModalCorreo(),2000);
  } catch(err){
    stEl.style.color='var(--danger-text)'; stEl.textContent='Error: '+err.message;
    btn.disabled=false; btn.textContent='📧 Enviar';
  }
}

async function submitForm(){
  const btn=document.getElementById('btnGuardar');
  const msg=document.getElementById('formMsg');
  msg.className='form-msg';
  const unit=document.getElementById('f-unit').value;
  const year=document.getElementById('f-year').value;
  const tipo=document.getElementById('f-tipo').value;
  if(!unit||!year||!tipo){ msg.className='form-msg err'; msg.textContent='Unidad, Año y Tipo de Evento son requeridos.'; return; }
  const unitNum=parseInt(unit.replace('U',''));
  btn.disabled=true; btn.textContent='Guardando en OneDrive...';
  msg.className='form-msg info'; msg.textContent='⟳ Subiendo datos...';

  const imp=[];
  for(let i=1;i<=7;i++){
    const vv=document.getElementById(`fi${i}v`)?.value;
    if(vv) imp.push({v:parseFloat(vv),i:parseFloat(document.getElementById(`fi${i}i`)?.value)||0,z:parseFloat(document.getElementById(`fi${i}z`)?.value)||0});
  }
  const fv=id=>document.getElementById(id)?.value||'';

  // Construir payload con keys que coinciden con H
  const payload={
    unidad:unit, noSerie:SERIALS[unitNum], anio:year, tipoEvento:tipo, fecha:fv('f-fecha'), otNo:fv('f-ot'),
    ue_1min:fv('f-ue1'), ue_10min:fv('f-ue10'), pi_ue:fv('f-piue'),
    ve_1min:fv('f-ve1'), ve_10min:fv('f-ve10'), pi_ve:fv('f-pive'),
    we_1min:fv('f-we1'), we_10min:fv('f-we10'), pi_we:fv('f-piwe'),
    u1v1_1min:fv('f-u1v11'), u1v1_10min:fv('f-u1v110'), pi_u1v1:fv('f-piu1v1'),
    v1w1_1min:fv('f-v1w11'), v1w1_10min:fv('f-v1w110'), pi_v1w1:fv('f-piv1w1'),
    w1u1_1min:fv('f-w1u11'), w1u1_10min:fv('f-w1u110'), pi_w1u1:fv('f-piw1u1'),
    p2_u:fv('f-p2u'), p2_v:fv('f-p2v'), p2_w:fv('f-p2w'),
    p3_plus:fv('f-p3p'), p3_minus:fv('f-p3m'), p3_obs:fv('f-p3obs'),
    p4_resist:fv('f-p4'),
    p5_j:fv('f-p5j'), p5_k:fv('f-p5k'), p5_jk_resist:fv('f-p5jk'), p5_obs:fv('f-p5obs'),
    p6_ir:fv('f-p6ir'), p6_u1v1:fv('f-p6u1v1'), p6_v1w1:fv('f-p6v1w1'), p6_w1u1:fv('f-p6w1u1'), p6_obs:fv('f-p6obs'),
    p7_ir:fv('f-p7ir'), p7_u1v1:fv('f-p7u1v1'), p7_v1w1:fv('f-p7v1w1'), p7_w1u1:fv('f-p7w1u1'),
    p8_forward:fv('f-p8f'), p8_reverse:fv('f-p8r'),
    p9_sr1:fv('f-sr1'), p9_sr2:fv('f-sr2'),
    // impedancia: aplanar en campos z1v..z7z
    ...(imp.reduce((acc,pt,i)=>({...acc,[`z${i+1}v`]:pt.v,[`z${i+1}i`]:pt.i,[`z${i+1}z`]:pt.z}),{})),
    supervisor:fv('f-sup'), tecnico:fv('f-tec'), cargoTecnico:fv('f-cargo'), observaciones:fv('f-obs'),
    _guardadoPor: currentUser?.username||'', _fechaGuardado: new Date().toISOString()
  };

  try {
    await saveCampaign(unitNum, payload);
    msg.className='form-msg ok'; msg.textContent=`✓ Guardado en OneDrive: ${OD_ROOT}/${OD_FOLDERS[unitNum]}/datos.json`;
    btn.textContent='✓ Guardado';
    setTimeout(()=>{ closePanel(); reloadData(); }, 1800);
  } catch(err) {
    msg.className='form-msg err'; msg.textContent='Error: '+err.message;
    btn.disabled=false; btn.textContent='☁ Guardar en OneDrive';
  }
}

function showHome(){
  currentScreen='home';
  ['home','g1','g2','g3'].forEach((id,i)=>{
    document.getElementById('screen-'+id).style.display=i===0?'block':'none';
    document.getElementById('tab-'+id).classList.toggle('active',i===0);

}
function showGen(n){
  currentScreen='g'+n;
  ['home','g1','g2','g3'].forEach((id,i)=>{
    document.getElementById('screen-'+id).style.display=i===n?'block':'none';
    document.getElementById('tab-'+id).classList.toggle('active',i===n);
  });
  renderGen(n);
}
function refresh(){ if(currentScreen==='home') renderHome(); else{ const n=parseInt(currentScreen.replace('g','')); renderGen(n); } }
function openPanel(){ document.getElementById('overlay').classList.add('open'); document.getElementById('sidePanel').classList.add('open'); }

  document.getElementById('overlay').classList.remove('open');

}
